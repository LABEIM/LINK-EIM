name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    uses: LABEIM/Shared-CICD/.github/workflows/deploy-app.yml@v1
    with:
      enable_cloudflare: true
      # [REQUIRED] Update with target Cloudflare Pages project name (e.g., 'project-comingsoon')
      cloudflare_project_name: 'link-eim'
      # @astrojs/cloudflare v12 writes the prerendered page and the Pages Functions worker
      # (dist/_worker.js, dist/_routes.json) into dist/. Pages serves the static files and runs
      # /keystatic and /api/keystatic/* through the worker, as on eimlab.org.
      dist_dir: 'dist'
      check_command: 'npm run check'
      enable_lighthouse: true
      lighthouse_routes: |
        /
    secrets: inherit
