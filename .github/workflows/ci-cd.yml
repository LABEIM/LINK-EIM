name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    uses: LABEIM/Shared-CICD/.github/workflows/deploy-app.yml@main
    with:
      enable_cloudflare: true
      # [REQUIRED] Update with target Cloudflare Pages project name (e.g., 'project-comingsoon')
      cloudflare_project_name: 'link-eim'
      # Astro's Cloudflare adapter writes the prerendered page to dist/client and the Worker to
      # dist/server. The shared action deploys a static directory to Pages, so point it at the
      # client output; otherwise it finds no dist/index.html and uploads its placeholder.
      # The /keystatic admin still needs the Worker cutover.
      dist_dir: 'dist/client'
      enable_lighthouse: true
      lighthouse_routes: |
        /
    secrets: inherit

  # Pages only serves dist/client, so /keystatic and /api/keystatic/* (server-rendered by
  # @astrojs/cloudflare) do not exist there. Deploy the Worker output as well; it serves the
  # same prerendered page through the ASSETS binding and runs the CMS routes.
  deploy-worker:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
