name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    uses: LABEIM/Shared-CICD/.github/workflows/deploy-app.yml@v2
    with:
      enable_cloudflare: true
      # [REQUIRED] Target Cloudflare Worker name (Workers and Pages are separate namespaces).
      cloudflare_project_name: 'link-eim'
      # @astrojs/cloudflare 14 writes a Worker + static assets layout to dist/
      # (dist/server/wrangler.json, dist/client/). The v2 pipeline deploys that Worker so
      # /keystatic and /api/keystatic/* stay server-rendered.
      cloudflare_mode: 'ssr'
      dist_dir: 'dist'
      check_command: 'npm run check'
      enable_lighthouse: true
      lighthouse_routes: |
        /
    secrets: inherit
