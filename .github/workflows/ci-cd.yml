name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    uses: LABEIM/Shared-CICD/.github/workflows/deploy-app.yml@main
    with:
      enable_cloudflare: true
      # [REQUIRED] Update with target Cloudflare Pages project name (e.g., 'project-comingsoon')
      cloudflare_project_name: 'link-eim'
      # Astro's Cloudflare adapter writes the prerendered page to dist/client and the Worker to
      # dist/server. The shared action deploys a static directory to Pages, so point it at the
      # client output; otherwise it finds no dist/index.html and uploads its placeholder.
      # The /keystatic admin still needs the Worker cutover.
      dist_dir: 'dist/client'
      enable_lighthouse: true
      lighthouse_routes: |
        /
    secrets: inherit
